<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Shaik Khaja Hussain — Enterprise Technical Lead">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070B"/>
      <stop offset="1" stop-color="#0F1420"/>
    </linearGradient>
    <radialGradient id="glow" cx="20%" cy="0%" r="80%">
      <stop offset="0" stop-color="#4C7CF3" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4C7CF3" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Brand mark -->
  <text x="80" y="110" font-family="IBM Plex Mono, SFMono-Regular, Menlo, monospace" font-size="20" fill="#C7CDD9">
    <tspan fill="#4C7CF3">&gt;</tspan> khaja.hussain
  </text>

  <!-- Eyebrow -->
  <g transform="translate(80, 220)">
    <circle cx="6" cy="-6" r="5" fill="#3DDC97"/>
    <text x="20" y="0" font-family="IBM Plex Mono, SFMono-Regular, monospace" font-size="18" letter-spacing="3" fill="#8FB0FA">
      OPEN TO TECHNICAL LEAD &amp; AI ENGINEERING ROLES
    </text>
  </g>

  <!-- Name -->
  <text x="80" y="320" font-family="Inter, system-ui, sans-serif" font-size="78" font-weight="600" fill="#F2F4F8" letter-spacing="-1.5">
    Shaik Khaja Hussain
  </text>

  <!-- Role tagline -->
  <text x="80" y="390" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="500" fill="#8FB0FA">
    Enterprise Technical Lead
  </text>

  <!-- Subtitle -->
  <text x="80" y="450" font-family="Inter, system-ui, sans-serif" font-size="24" fill="#8B95A7">
    Enterprise Java · Distributed Systems · Cloud · AI Engineering
  </text>

  <!-- Footer strip -->
  <line x1="80" y1="540" x2="1120" y2="540" stroke="#1E2530" stroke-width="1"/>
  <text x="80" y="580" font-family="IBM Plex Mono, SFMono-Regular, monospace" font-size="18" fill="#5B6578">
    Nearly 15 years — telecom, banking, financial services
  </text>
  <text x="1120" y="580" text-anchor="end" font-family="IBM Plex Mono, SFMono-Regular, monospace" font-size="18" fill="#5B6578">
    javageeks.github.io
  </text>
</svg>
